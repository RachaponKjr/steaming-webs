name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project folder to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "~/steaming-project"

      - name: Run Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/steaming-project

            # 1. สร้างไฟล์ .env สำหรับ Backend (back-staeaming)
            mkdir -p back-staeaming
            echo "${{ secrets.PRODUCTION_ENV }}" > back-staeaming/.env

            # 2. สร้างไฟล์ .env สำหรับ Frontend (front-steaming)
            # *หมายเหตุ: หากคุณใช้ Secret แยกกัน ให้เปลี่ยนชื่อ secret ด้านหลังได้ เช่น ${{ secrets.FRONTEND_ENV }} 
            # แต่ถ้าใช้ตัวเดียวกัน สามารถปล่อยไว้แบบนี้ได้เลยครับ
            mkdir -p front-steaming
            echo "${{ secrets.PRODUCTION_ENV }}" > front-steaming/.env

            # 3. รัน Docker Compose เพื่อ Build และอัปเดตระบบทั้ง Backend และ Frontend พร้อมกัน
            docker compose down
            docker compose up -d --build

            # 4. ล้าง Docker image เก่าที่ไม่ได้ใช้เพื่อประหยัดพื้นที่
            docker image prune -f