name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project folder to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "~/steaming-project"

      - name: Run Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/steaming-project

            mkdir -p back-steaming
            echo "${{ secrets.PRODUCTION_ENV }}" > back-steaming/.env

            mkdir -p front-steaming
            echo "${{ secrets.PRODUCTION_ENV }}" > front-steaming/.env

            docker compose down

            echo "=============================="
            echo "🔨 BUILDING BACKEND (app)..."
            echo "=============================="
            docker compose build app --progress=plain

            echo "=============================="
            echo "🔨 BUILDING FRONTEND (front)..."
            echo "=============================="
            docker compose build front --progress=plain

            echo "=============================="
            echo "🚀 STARTING ALL SERVICES..."
            echo "=============================="
            docker compose up -d

            docker image prune -f