port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  # ใช้ UDP พอร์ตเดียว (mux) แทนการเปิดช่วงพอร์ต — เสถียรกว่าและรองรับผู้ชมได้เยอะกว่า
  # เมื่อรันหลัง Docker/NAT
  udp_port: 7882
  # ระบุ IP สาธารณะของเครื่องเซิร์ฟเวอร์ตรง ๆ
  # NOTE: ถ้าเทสต์บนเครื่องตัวเอง (localhost) ให้เปลี่ยนเป็น 127.0.0.1
  #       use_external_ip กับ node_ip ใช้พร้อมกันไม่ได้
  use_external_ip: false
  node_ip: 119.59.102.57

room:
  auto_create: true
  empty_timeout: 300

logging:
  level: info

keys:
  # ต้องตรงกับ LIVEKIT_API_KEY / LIVEKIT_API_SECRET ของ backend
  # รูปแบบคือ  <API_KEY>: "<API_SECRET>"   (secret ต้องยาวอย่างน้อย 32 ตัวอักษร)
  # สำคัญ: แก้ไฟล์นี้แล้วต้อง `docker compose restart livekit` เสมอ
  #        เพราะ LiveKit อ่าน config แค่ตอน start เท่านั้น
  livekit_api_key: "rh3wJ0eht6pwCWrGNkP8UUfgu3qumyKlUGbAt0bePS4="
